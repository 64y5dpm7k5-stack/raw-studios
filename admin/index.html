<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - RAW STUDIOS</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .box { background: #222; padding: 25px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #fff; font-size: 20px; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; background: #333; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        textarea { height: 100px; resize: vertical; }
        button { width: 100%; padding: 12px; background: #e50914; border: none; color: #fff; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #b20710; }
        .logout-btn { background: #444; margin-top: 10px; }
        .logout-btn:hover { background: #555; }
        .error { color: #ff4d4d; font-size: 14px; text-align: center; margin-bottom: 10px; display: none; }
        .success { color: #4cd137; font-size: 14px; text-align: center; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

<!-- FORM LOGIN -->
<div class="box" id="loginForm">
    <h2>Admin RAW STUDIOS</h2>
    <div id="errorMsg" class="error">Email atau Password salah!</div>
    <input type="email" id="email" placeholder="Email Admin" required>
    <input type="password" id="password" placeholder="Password Baru" required>
    <button onclick="handleLogin()">Masuk</button>
</div>

<!-- PANEL ADMIN & EDITOR -->
<div class="box" id="adminPanel" style="display:none;">
    <h2>Dashboard Konten</h2>
    <div id="successMsg" class="success">Berhasil disimpan!</div>
    
    <label style="font-size: 13px; color: #aaa;">Judul Utama Website:</label>
    <input type="text" id="siteTitle" placeholder="Contoh: RAW STUDIOS">

    <label style="font-size: 13px; color: #aaa;">Teks Sambutan / Deskripsi:</label>
    <textarea id="siteDesc" placeholder="Tulis deskripsi agensi di sini..."></textarea>

    <button onclick="saveContent()">Simpan Perubahan</button>
    <button class="logout-btn" onclick="handleLogout()">Keluar</button>
</div>

<script>
    // SILAKAN UBAH EMAIL DAN PASSWORD DI BAWAH INI SESUAI KEINGINAN KAKAK
    const ADMIN_EMAIL = "admin@rawstds.com";
    const ADMIN_PASS = "rawstudios2026";

    // Cek status login saat halaman dibuka
    if (localStorage.getItem("isLoggedIn") === "true") {
        showPanel();
        loadSavedContent();
    }

    function handleLogin() {
        const inputEmail = document.getElementById("email").value;
        const inputPass = document.getElementById("password").value;

        if (inputEmail === ADMIN_EMAIL && inputPass === ADMIN_PASS) {
            localStorage.setItem("isLoggedIn", "true");
            showPanel();
            loadSavedContent();
        } else {
            document.getElementById("errorMsg").style.display = "block";
        }
    }

    function showPanel() {
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
    }

    function saveContent() {
        const title = document.getElementById("siteTitle").value;
        const desc = document.getElementById("siteDesc").value;

        // Simpan data ke memori browser
        localStorage.setItem("savedTitle", title);
        localStorage.setItem("savedDesc", desc);

        const msg = document.getElementById("successMsg");
        msg.style.display = "block";
        setTimeout(() => { msg.style.display = "none"; }, 3000);
    }

    function loadSavedContent() {
        if (localStorage.getItem("savedTitle")) {
            document.getElementById("siteTitle").value = localStorage.getItem("savedTitle");
        }
        if (localStorage.getItem("savedDesc")) {
            document.getElementById("siteDesc").value = localStorage.getItem("savedDesc");
        }
    }

    function handleLogout() {
        localStorage.removeItem("isLoggedIn");
        location.reload();
    }
</script>

</body>
</html>
