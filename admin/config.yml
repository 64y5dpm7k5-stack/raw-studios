backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Halaman"
    files:
      - file: "index.html"
        label: "Landing Page RAW STUDIOS"
        name: "index"
        fields:
          - { label: "Judul Utama (Hero)", name: "hero_title", widget: "string" }
          - { label: "Subjudul Utama", name: "hero_desc", widget: "text" }
